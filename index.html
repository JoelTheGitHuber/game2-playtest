		<title>Factory Tycoon Idle</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
/* Factory Tycoon Idle: our own loading screen (no engine logo) */
body, #status { background-color: #1b2026; }
#status-splash { position: static; display: flex; flex-direction: column; align-items: center; gap: 0.6rem;
	font-family: 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif; text-align: center; padding: 0 1.5rem; }
#status-splash .t { font-size: clamp(2rem, 7vw, 3.6rem); font-weight: 800; color: #f2b733; letter-spacing: 0.02em; }
#status-splash .s { font-size: clamp(1rem, 3.5vw, 1.3rem); color: #a7b0ba; }
#status-splash .logo { width: min(80vw, 560px); height: auto; filter: drop-shadow(0 0.5rem 1rem rgba(0,0,0,0.45)); }
#status-splash .mark { width: 4.5rem; height: 4.5rem; border-radius: 1.2rem; background: #2f5f45; display: grid; place-items: center;
	box-shadow: 0 0.4rem 0 #0c0f12; font-size: 2.4rem; }
#status-progress { -webkit-appearance: none; appearance: none; position: absolute; bottom: 14%; left: 0; right: 0; width: min(70%, 420px);
	height: 14px; border: 0; border-radius: 7px; background: #2a323c; overflow: hidden; }
#status-progress::-webkit-progress-bar { background: #2a323c; border-radius: 7px; }
#status-progress::-webkit-progress-value { background: #5cc23c; border-radius: 7px; }
#status-progress::-moz-progress-bar { background: #5cc23c; border-radius: 7px; }

	function setStatusMode(mode) {
